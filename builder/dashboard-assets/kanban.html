<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Задачи · Командный центр</title>
<style>
:root{font:16px/1.45 system-ui,sans-serif;color-scheme:light dark;color:CanvasText;background:Canvas}*{box-sizing:border-box}body{margin:0 auto;max-width:1440px;padding:clamp(16px,4vw,48px)}a{color:inherit}header,form,nav,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}form,nav{margin:1rem 0}input,select,button{font:inherit;padding:.5rem;border-radius:.4rem;border:1px solid GrayText}button,summary{cursor:pointer}input[name=title]{flex:1;min-width:min(220px,100%)}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}section,details{padding:1rem;border-radius:.6rem;background:color-mix(in srgb,CanvasText 6%,Canvas);align-self:start}article{margin-top:.7rem;background:Canvas;padding:.8rem;border-radius:.4rem;overflow-wrap:anywhere}.actions{gap:6px;margin-top:.5rem}.actions button{font-size:.86rem}h2,summary{font-size:1.1rem;font-weight:650;margin:0}small{display:block;margin-top:.4rem}label{display:inline-flex;gap:.4rem;align-items:center}#message{min-height:1.5em}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid Highlight}@media(max-width:760px){main{grid-template-columns:1fr}}[hidden]{display:none!important}
h1{margin:.1em 0 .25em;letter-spacing:-.04em;font-size:clamp(2.25rem,6vw,3.6rem)}article>a{font-weight:650;text-decoration-thickness:1px;text-underline-offset:3px}section{border-top:3px solid #8995ae}section:nth-child(2){border-top-color:#7981e7}details{border-top:3px solid #5eaa8b}article{border:1px solid color-mix(in srgb,CanvasText 15%,Canvas)}small{opacity:.8}.actions label{font-size:.88rem;cursor:pointer}.actions input{width:1.15rem;height:1.15rem;accent-color:#5c60be}details article>a{text-decoration:line-through}form button{background:#484db1;color:white;border-color:#484db1}button:hover{filter:brightness(.94)}
</style>
<header><h1>Задачи</h1><a href="/">Командный центр</a></header>
<form id="add" hidden><input name="title" maxlength="250" placeholder="Новая задача" aria-label="Название задачи" required><input name="project" list="projects" placeholder="Проект" aria-label="Проект" maxlength="120">
<datalist id="projects"></datalist><label>В план <input type="date" name="plan"></label><label>Срок <input type="date" name="due"></label><button>Добавить</button></form>
<nav><label>Проект <select id="filter"><option value="">Все</option></select></label><label>Показать <select id="view"><option value="all">Все задачи</option><option value="day">План дня</option><option value="overdue">Хвосты</option></select></label><button id="reload">Обновить</button></nav>
<p role="status" id="message"></p><main id="columns"></main>
<script>
const $=s=>document.getElementById(s);
const form=$('add'), message=$('message'), columns=$('columns');
let cards=[],busy=false,doneOpen=false,request=null;
function element(tag,text){const el=document.createElement(tag);el.textContent=text;return el}
function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
async function api(data){
  const headers={'Content-Type':'application/json'};
  const token=localStorage.getItem('command-center.jarvis-run-token');
  if(token)headers['X-Dashboard-Run-Token']=token;
  const r=await fetch('/api/kanban',{method:'POST',headers,body:JSON.stringify(data),cache:'no-store'});
  if(r.status===401||r.status===403){
    cards=[];request=null;form.reset();form.hidden=true;columns.replaceChildren();
    $('filter').replaceChildren(new Option('Все',''));$('projects').replaceChildren();
    throw Error('Войди в Командный центр и обнови доску.');
  }
  if(!r.ok){let result={};try{result=await r.json()}catch{}throw Error(result.error||'Не удалось получить ответ от доски.')}
  return r.json()
}
function draw(){
  columns.replaceChildren();
  const projects=[...new Set(cards.map(c=>c.project))].sort();
  const filter=$('filter'), selected=filter.value;
  $('projects').replaceChildren(...projects.map(p=>new Option(p,p)));
  filter.replaceChildren(new Option('Все',''),...projects.map(p=>new Option(p,p)));filter.value=selected;
  const day=today(),view=$('view').value;
  const visible=cards.filter(c=>(!selected||c.project===selected)&&(view==='all'||(c.status!=='done'&&(view==='day'?c.plan===day:c.due&&c.due<day))));
  for(const [state,title] of [['todo','Сделать'],['doing','В процессе'],['done','Готово']]){
    const group=visible.filter(c=>c.status===state),done=state==='done',col=document.createElement(done?'details':'section');
    col.append(element(done?'summary':'h2',title+' · '+group.length));
    if(done){col.open=doneOpen;col.ontoggle=()=>{doneOpen=col.open}}
    for(const c of group){
      const card=document.createElement('article'),link=element('a',c.title);link.href=c.url;card.append(link);
      const facts=[c.project,c.plan?'План '+c.plan:'',c.due?'Срок '+c.due:''].filter(Boolean);
      card.append(element('small',facts.join(' · ')));const actions=element('div','');actions.className='actions';
      function action(label,changes){const b=element('button',label);b.onclick=()=>run(async()=>{const updated=await api({action:'update_task',id:c.id,revision:c.revision,...changes});cards=cards.map(x=>x.id===c.id?updated:x);draw()});actions.append(b)}
      const label=element('label',done?'Вернуть':'Готово'), check=document.createElement('input');
      check.type='checkbox';check.checked=done;check.setAttribute('aria-label',(done?'Вернуть задачу ':'Завершить задачу ')+c.title);
      check.onchange=()=>{check.checked=done;run(async()=>{const updated=await api({action:'update_task',id:c.id,revision:c.revision,status:done?'todo':'done'});cards=cards.map(x=>x.id===c.id?updated:x);draw()})};label.prepend(check);actions.append(label);
      if(!done){action(state==='todo'?'Начать':'В список',{status:state==='todo'?'doing':'todo'});action(c.plan===day?'Убрать из дня':'В план дня',{plan:c.plan===day?'':day})}
      card.append(actions);col.append(card)
    }columns.append(col)
  }
}
async function run(fn){if(busy)return;busy=true;message.textContent='Сохраняю…';try{await fn();message.textContent=''}catch(e){message.textContent=e.message}finally{busy=false}}
async function refresh(){await run(async()=>{message.textContent='Загрузка…';cards=await api({action:'list_tasks',include_done:true});form.hidden=false;draw()})}
form.onsubmit=e=>{e.preventDefault();run(async()=>{const data=Object.fromEntries(new FormData(form));const signature=JSON.stringify(data);
  if(request?.signature!==signature)request={signature,key:crypto.randomUUID()};
  const saved=await api({action:'create_task',source_key:'dashboard:'+request.key,...data});
  cards=[saved,...cards.filter(c=>c.id!==saved.id)];request=null;form.reset();draw()
})};
$('filter').onchange=draw;$('view').onchange=draw;$('reload').onclick=refresh;refresh()
</script></html>
