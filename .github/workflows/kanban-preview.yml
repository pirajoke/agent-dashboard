name: Kanban browser acceptance
on:
  push:
    branches: [qa/personal-kanban-preview]
permissions:
  contents: read
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - name: Test the board at desktop and phone widths
        run: python qa_kanban_screen.py
      - uses: actions/upload-artifact@v4
        with:
          name: kanban-browser-screens
          path: qa-screens/kanban-*.png
          if-no-files-found: error
          retention-days: 5
