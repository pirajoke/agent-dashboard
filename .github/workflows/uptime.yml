name: Uptime

# External ping for the Mac mini. Command Center sits behind Cloudflare Access, so a 302 login
# redirect is not health: the workflow needs a service token and requires JSON HTTP 200 from
# the origin-backed /api/health route.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Probe endpoints
        id: probe
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python3 .github/scripts/uptime_probe.py

      - name: Open or close the uptime issue
        env:
          DOWN: ${{ steps.probe.outputs.down }}
          UNCONFIGURED: ${{ steps.probe.outputs.unconfigured }}
        run: |
          tg() {
            [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ] || return 0
            curl -s -m 15 -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" --data-urlencode "text=$1" >/dev/null || true
          }
          gh label create uptime --color B60205 --description "External uptime ping" 2>/dev/null || true
          open=$(gh issue list --label uptime --state open --json number -q '.[0].number')
          fingerprint=$(printf '%s\n%s\n' "$DOWN" "$UNCONFIGURED" | sha256sum | cut -d ' ' -f1)
          if [ -n "$DOWN" ]; then
            title="Mac mini unreachable from outside"
            body="Failed after 3 attempts at $(date -u '+%F %H:%M') UTC: $DOWN"
            if [ -n "$UNCONFIGURED" ]; then
              body="$body. Monitor configuration also needs attention: $UNCONFIGURED"
            fi
            body="$body

          <!-- uptime-state:$fingerprint -->"
            if [ -z "$open" ]; then
              gh issue create --label uptime --title "$title" --body "$body"
              tg "🚨 Внешний пинг: Mac mini не отвечает снаружи. $DOWN"
            else
              current_title=$(gh issue view "$open" --json title -q .title)
              current_body=$(gh issue view "$open" --json body -q .body)
              same_state=""
              case "$current_body" in
                *"<!-- uptime-state:$fingerprint -->"*) same_state=1 ;;
              esac
              if [ "$current_title" != "$title" ] || [ -z "$same_state" ]; then
                gh issue edit "$open" --title "$title" --body "$body"
                tg "🚨 Внешний пинг: Mac mini не отвечает снаружи. $DOWN"
              fi
            fi
          elif [ -n "$UNCONFIGURED" ]; then
            title="External uptime monitor needs configuration"
            body="Monitoring is fail-closed at $(date -u '+%F %H:%M') UTC: $UNCONFIGURED. Create a Cloudflare Access service token, allow it for command.meshly.fr, then add CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET as Actions secrets."
            body="$body

          <!-- uptime-state:$fingerprint -->"
            if [ -z "$open" ]; then
              gh issue create --label uptime --title "$title" --body "$body"
              tg "⚠️ Внешний пинг Command Center не настроен: нужен Cloudflare Access service token."
            else
              current_title=$(gh issue view "$open" --json title -q .title)
              current_body=$(gh issue view "$open" --json body -q .body)
              same_state=""
              case "$current_body" in
                *"<!-- uptime-state:$fingerprint -->"*) same_state=1 ;;
              esac
              if [ "$current_title" != "$title" ] || [ -z "$same_state" ]; then
                gh issue edit "$open" --title "$title" --body "$body"
                tg "⚠️ Внешний пинг Command Center не настроен: нужен Cloudflare Access service token."
              fi
            fi
          elif [ -z "$DOWN" ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "Back up at $(date -u '+%F %H:%M') UTC."
            tg "✅ Внешний пинг: Mac mini снова отвечает."
          fi
